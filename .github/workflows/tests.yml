name: Python prototype checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
        os: [ubuntu-latest]
        include:
          - os: macos-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.12'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python main.py --headless --frames 5
      - name: Cocoa display smoke test
        if: runner.os == 'macOS'
        run: python main.py --scene intro --frames 20 --fixed-dt 1
